<!doctype html>
<html lang="nl">
<head>
	<meta charset="utf-8">
	<link rel="stylesheet" href="popup.css">
</head>
<body>
	<div class="popup">
		<h1>TCG Label Printer</h1>
		<div class="error" id="error" hidden></div>
		<div id="ready" class="stack" hidden>
			<div class="summary">
				<span class="count" id="count"></span>
				<span class="month"><span class="swatch" id="swatch"></span><span id="month"></span></span>
			</div>
			<div class="warning" id="warning" hidden></div>
			<label class="start">
				Start bij label
				<input type="number" id="start" min="1" max="270" step="1">
				<button type="button" id="new-sheet">Nieuw vel</button>
			</label>
			<span class="hint" id="hint"></span>
			<button type="button" class="primary" id="print">Printen</button>
		</div>
		<div class="footer"><a href="#" id="options">Instellingen</a></div>
	</div>
	<script type="module" src="popup.js"></script>
</body>
</html>
